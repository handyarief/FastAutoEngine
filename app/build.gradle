
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fastauto.engine'

    compileSdk 34

    defaultConfig {
        applicationId "com.fastauto.engine"

        minSdk 26
        targetSdk 34

        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // Jangan aktifkan minify sebelum pengujian integrasi.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    // Digunakan MainActivity dan komponen AppCompat.
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Digunakan ScreenCaptureService untuk NotificationCompat.
    implementation 'androidx.core:core-ktx:1.12.0'

    // Digunakan FlowEngine dan proses coroutine.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
